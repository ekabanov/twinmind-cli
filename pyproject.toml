[project]
name = "twinmind-crawler"
version = "0.1.0"
description = "Download meeting transcripts and summaries from Twinmind"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "requests>=2.31",
    "python-dateutil>=2.8",
]

[project.scripts]
twinmind-crawler = "twinmind_crawler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twinmind_crawler"]
