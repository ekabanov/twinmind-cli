[project]
name = "twinmind-cli"
version = "0.2.0"
description = "CLI and Claude Code skill for Twinmind meeting transcripts and summaries"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dateutil>=2.8",
]

[project.scripts]
twinmind = "twinmind_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twinmind_cli"]
